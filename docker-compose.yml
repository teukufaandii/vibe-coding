services:
  db:
    image: postgres:16-alpine
    container_name: vibe-coding-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vibe_coding_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: vibe-coding-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
